COM_VLOGS_WHATS_NEW = "<h3>v.2.2.0 What's new?</h3><h4>Joomla 6 & PHP 8.4 ready</h4><p>Compatible with Joomla 6 and PHP 8.4.</p><h4>Updating the interface</h4><p>A major interface update: added the display of additional information in the file list. Viewing the log file in a modal window and the ability to open it in a separate window. Changing the appearance of the file list compared to 2.1.0. A table view was made based on recommendations and requests from members of the Joomla community.</p><h4>Large files are marked</h4><p>Large files (larger than 1MB) cannot be opened in a modal window, but they can be opened in a separate one. Be careful when using this feature.</p><h4>Search by file name</h4><p>Added a search filter based on the name of the log file on the page. Find the file you need faster.</p><h4>System requirements have been raised</h4><p>The minimum version of PHP is 8.0.</p>"
